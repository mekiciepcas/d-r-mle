<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#223d35">
    <meta name="application-name" content="Dürümle">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Dürümle • Mahallenin Ustası</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="icon" href="./icons/icon-192.png" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <link rel="stylesheet" href="style.css?v=6">
    <link rel="stylesheet" href="mobile.css?v=6">
  </head>
  <body>
    <canvas id="world" aria-label="Dürümle restoranı. WASD veya ok tuşlarıyla yürü, E ile etkileş."></canvas>
    <header class="hud">
      <div class="logo">dürümle<small>MAHALLENİN USTASI</small></div>
      <div class="pill"><span>◉</span><b id="cash">₺800</b></div>
      <div class="pill day"><span>☀</span><b id="day">1. gün</b><small id="time">03:00</small></div>
      <button id="team" class="team-button" aria-label="Ekip ve personel işe alma">Ekip</button>
      <button id="sound" class="round" aria-label="Sesi aç">♪</button>
      <button id="pause" class="round" aria-label="Oyunu duraklat">Ⅱ</button>
    </header>
    <aside class="mission">
      <span>✦</span>
      <div>
        <small>ŞUBENİN HİKÂYESİ</small>
        <b id="mission">İlk müşterini karşıla</b>
        <p id="hint">Müşteriye yaklaş ve E’ye bas.</p>
      </div>
      <span id="score">0 / 6</span>
    </aside>
    <div id="service-status" class="service-status"></div>
    <div id="kitchen-panel" class="live-panel" hidden><div id="kitchen-body"></div></div>
    <div id="register-panel" class="live-panel register-panel" hidden><div id="register-body"></div></div>
    <div id="held" class="held" hidden></div>
    <div class="bottom-note"><b>KADIKÖY</b> • Senin şuben, senin hikâyen.<span>Bağımsız hayran oyunu</span></div>
    <div id="toast" role="status"></div>
    <div class="controls">
      <div id="joystick" aria-label="Hareket joystick'i">
        <div class="joy-ring"></div>
        <div id="knob"></div>
        <span>HAREKET</span>
      </div>
      <div class="action-wrap">
        <div id="context">Müşteriye yaklaş</div>
        <button id="action" aria-label="Etkileş"><b>E</b><span>ETKİLEŞ</span></button>
      </div>
    </div>
    <div class="keyboard">W A S D / ↑ ↓ ← → <span>HAREKET</span> <b>E</b> <span>ETKİLEŞ</span> <b>ESC</b> <span>DURAKLAT</span></div>
    <dialog id="dialog"><div id="dialog-body"></div></dialog>
    <script type="module" src="game.js?v=6"></script>
    <script type="module" src="pwa.js"></script>
  </body>
</html>
